services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LOOP_COOKIE_SECURE: "1"
    volumes:
      - loop-data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  loop-data:
  caddy-data:
